<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Coach morning call</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 1080px; height: 1350px;
    background: #000; color: #fff;
    font-family: Inter, "SF Pro Display", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .card {
    width: 1080px; height: 1350px;
    padding: 52px 52px 44px;
    display: flex; flex-direction: column; gap: 28px;
    background: #000;
  }
  .mast {
    display: flex; justify-content: space-between; align-items: baseline;
  }
  .brand {
    font-size: 13px; font-weight: 700; letter-spacing: 0.22em;
    text-transform: uppercase; color: #6b7178;
  }
  .date {
    font-size: 15px; font-weight: 500; color: #a6acb3;
    font-variant-numeric: tabular-nums;
  }
  .hero {
    background: #121417;
    border: 1px solid #2a2e33;
    border-radius: 16px;
    padding: 36px 40px 32px;
    position: relative;
    overflow: hidden;
  }
  .hero::before {
    content: "";
    position: absolute; left: 0; top: 0; bottom: 0; width: 6px;
    background: var(--call, #ffde00);
  }
  .call {
    font-size: 88px; font-weight: 800; letter-spacing: -0.045em;
    line-height: 0.95; color: var(--call, #ffde00);
    font-variant-numeric: tabular-nums;
  }
  .why {
    margin-top: 14px;
    font-size: 22px; font-weight: 500; color: #a6acb3;
    line-height: 1.35; max-width: 900px;
  }
  .block {
    background: #121417;
    border: 1px solid #2a2e33;
    border-radius: 16px;
    padding: 24px;
    display: flex; flex-direction: column; gap: 18px;
  }
  .block-h {
    display: flex; align-items: center; gap: 10px;
  }
  .dot { width: 10px; height: 10px; border-radius: 50%; }
  .dot.oura { background: #4fd1c5; }
  .dot.garmin { background: #2a9fd6; }
  .block-title {
    font-size: 13px; font-weight: 700; letter-spacing: 0.18em;
    text-transform: uppercase;
  }
  .block-title.oura { color: #4fd1c5; }
  .block-title.garmin { color: #2a9fd6; }
  .badge {
    margin-left: auto;
    font-size: 12px; font-weight: 700; letter-spacing: 0.1em;
    text-transform: uppercase; color: #6b7178;
    background: #1b1e22; padding: 5px 10px; border-radius: 999px;
  }
  .badge.nodata { color: #ff8a80; background: #2a1212; }
  .oura-grid {
    display: grid;
    grid-template-columns: 1.15fr 1fr 1fr;
    grid-template-rows: 1fr 1fr;
    gap: 1px;
    background: #2a2e33;
    border: 1px solid #2a2e33;
    border-radius: 12px;
    overflow: hidden;
    min-height: 280px;
  }
  .cell {
    background: #1b1e22;
    padding: 22px 20px;
    display: flex; flex-direction: column; justify-content: space-between;
    gap: 10px; min-width: 0;
  }
  .cell.hero-cell {
    grid-row: 1 / span 2;
    padding: 28px 24px;
  }
  .eyebrow {
    font-size: 12px; font-weight: 700; letter-spacing: 0.14em;
    text-transform: uppercase; color: #6b7178;
  }
  .val {
    font-size: 36px; font-weight: 800; letter-spacing: -0.03em;
    font-variant-numeric: tabular-nums; color: #fff; line-height: 1;
  }
  .cell.hero-cell .val {
    font-size: 92px; letter-spacing: -0.05em; color: #4fd1c5;
  }
  .val.muted { color: #555; font-size: 40px; }
  .unit {
    font-size: 14px; font-weight: 600; color: #6b7178; margin-left: 4px;
  }
  .garmin-grid {
    display: grid;
    grid-template-columns: 1.3fr 1fr;
    grid-template-rows: auto auto;
    gap: 1px;
    background: #2a2e33;
    border: 1px solid #2a2e33;
    border-radius: 12px;
    overflow: hidden;
  }
  .garmin-grid .cell.status {
    grid-row: 1 / span 2;
    padding: 28px 24px;
  }
  .garmin-grid .cell.status .val {
    font-size: 44px; color: #2a9fd6; letter-spacing: -0.03em;
  }
  .foot {
    margin-top: auto;
    padding-top: 18px;
    border-top: 1px solid #2a2e33;
    display: flex; justify-content: space-between; align-items: center;
  }
  .xunji { font-size: 16px; color: #6b7178; }
  .xunji strong { color: #a6acb3; font-weight: 700; }
  .xunji.blocked strong { color: #ff8a80; }
  .stamp {
    font-size: 12px; font-weight: 700; letter-spacing: 0.16em;
    text-transform: uppercase; color: #555;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="mast">
      <div class="brand">Daily Coach</div>
      <div class="date" id="date">Fri Sep 11 · ET</div>
    </div>

    <div class="hero" id="hero" style="--call:#ffde00">
      <div class="call" id="call">Maintain</div>
      <div class="why" id="why">Overnight solid; load still in Recovery — no intensity spike.</div>
    </div>

    <section class="block" id="oura-feed">
      <div class="block-h">
        <span class="dot oura"></span>
        <span class="block-title oura">Oura</span>
        <span class="badge" id="oura-badge">Today</span>
      </div>
      <div class="oura-grid" id="oura-grid">
        <div class="cell hero-cell">
          <div class="eyebrow">Readiness</div>
          <div class="val" id="oura-ready">78</div>
        </div>
        <div class="cell">
          <div class="eyebrow">Sleep</div>
          <div class="val" id="oura-sleep">88</div>
        </div>
        <div class="cell">
          <div class="eyebrow">Duration</div>
          <div class="val" id="oura-dur" style="font-size:28px">7h 45m</div>
        </div>
        <div class="cell">
          <div class="eyebrow">HRV</div>
          <div class="val" id="oura-hrv">80<span class="unit">ms</span></div>
        </div>
        <div class="cell">
          <div class="eyebrow">RHR</div>
          <div class="val" id="oura-rhr">51<span class="unit">bpm</span></div>
        </div>
      </div>
    </section>

    <section class="block" id="garmin-feed">
      <div class="block-h">
        <span class="dot garmin"></span>
        <span class="block-title garmin">Garmin</span>
        <span class="badge" id="garmin-badge">Today</span>
      </div>
      <div class="garmin-grid" id="garmin-grid">
        <div class="cell status">
          <div class="eyebrow">Training status</div>
          <div class="val" id="garmin-status">Recovery</div>
          <div class="eyebrow" style="margin-top:16px" id="garmin-load-line">Acute 139 · Low</div>
        </div>
        <div class="cell">
          <div class="eyebrow">VO₂ max</div>
          <div class="val" id="garmin-vo2">56</div>
        </div>
        <div class="cell">
          <div class="eyebrow">Last session</div>
          <div class="val" id="garmin-last" style="font-size:24px">Sep 9 Strength</div>
        </div>
      </div>
    </section>

    <div class="foot">
      <div class="xunji blocked" id="xunji"><strong>训记</strong> · no data</div>
      <div class="stamp">Today only</div>
    </div>
  </div>
</body>
</html>
